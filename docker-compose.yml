
services:
  web:
    build: .
    container_name: airnbn_app
    env_file:
      - .env
    volumes:
      - .:/app
      - static_volume:/app/static_collected
    expose:
      - "8000"
    depends_on:
      - db
    restart: unless-stopped
    command: ["gunicorn","airnbn.wsgi:application","--bind","0.0.0.0:8000","--workers","3"]

  db:
    image: postgres:17
    container_name: postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    restart: unless-stopped

  nginx:
    image: nginx:1.25
    container_name: airnbn_nginx
    ports:
      - "8000:80"
    volumes:
      - static_volume:/static:ro
      - ./nginx.config:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume: